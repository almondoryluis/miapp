name: GitHub Action para crear una APK desde un proyecto Flutter
on: [push]

jobs: 
  build:
    name: Construir APK
    runs-on: ubuntu-latest # Referencia: https://github.com/actions/runner-images/#available-images
    steps:
      - name: 1. Clonar repositorio
        uses: actions/checkout@v3

      - name: 2. Configurar JDK
        uses: actions/setup-java@v2
        with:
          java-version: '11'
          distribution: 'zulu'

      - name: 3. Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 4. Instalar paquetes utilizados por la app
        run: flutter pub get
      
      # Opcional:
      # - name: Ejecutar pruebas
      #   run: flutter test

      - name: 5. Construir APK
        run: flutter build apk # construir un sólo APK para todas las ABI

      - name: Renombrar el APK
      - run: mv build\app\outputs\flutter-apk\app-release.apk build\app\outputs\flutter-apk\miapp-flutter.apk
        
        # run: flutter build apk --split-per-abi # construir un APK para cada ABI

      # Opcional: 
      # - name: Construir el appbundle de la apk (para subir a Play Store)
      #   run: flutter build appbundle

      - name: 6. Publicar release
        uses: softprops/action-gh-release@v1
        with:
          files:
            build\app\outputs\flutter-apk\miapp-flutter.apk
        #  files: |
        #    build\app\outputs\flutter-apk\app-armeabi-v7a-release.apk
        #    build\app\outputs\flutter-apk\app-arm64-v8a-release.apk
        #    build\app\outputs\flutter-apk\app-x86_64-release.apk
