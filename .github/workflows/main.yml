name: GitHub Action para crear una APK desde un proyecto Flutter
on:
  push:
    tags:
      # Docs: https://stackoverflow.com/a/71076957
      #       https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#patterns-to-match-branches-and-tags
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  build:
    # Docs: https://docs.github.com/en/actions/learn-github-actions/contexts
    if: startsWith(github.ref, 'refs/tags/')
    name: Construir APK
    # Docs: https://github.com/actions/runner-images/#available-images
    runs-on: ubuntu-latest
    permissions:
      # Docs: https://github.com/softprops/action-gh-release#permissions
      #       https://docs.github.com/es/actions/security-guides/automatic-token-authentication
      #       https://github.com/ossf/scorecard/blob/main/docs/checks.md#token-permissions
      # Conf: https://github.com/almondoryluis/miapp-flutter/settings/actions
      contents: write

    steps:
      # 1. Clonar repositorio
      - uses: actions/checkout@v3

      # 2. Configurar JDK
      - uses: actions/setup-java@v2
        with:
          java-version: '11'
          distribution: 'zulu'

      # 3. Configurar Flutter SDK
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 4. Instalar paquetes utilizados por la app
      - run: flutter pub get

      # Opcional:
      # Ejecutar pruebas
      # - run: flutter test

      # 5. Construir APK
      - run: flutter build apk # construir un sólo APK para todas las ABI
      # Renombrar el APK
      - run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/miapp-${{ github.ref_name }}.apk

      # 5. Construir APKs
      # - run: flutter build apk --split-per-abi # construir un APK para cada ABI
      # Renombrar los APKs
      # - run: |
      #     mv build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build/app/outputs/flutter-apk/app-armeabi-v7a-release-$GITHUB_REF_NAME.apk
      #     mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/app-arm64-v8a-release-$GITHUB_REF_NAME.apk
      #     mv build/app/outputs/flutter-apk/app-x86_64-release.apk build/app/outputs/flutter-apk/app-x86_64-release-$GITHUB_REF_NAME.apk

      # Opcional:
      # Construir el appbundle de la apk (para subir a Play Store)
      # - run: flutter build appbundle

      # 6. Publicar entrega
      - uses: softprops/action-gh-release@v1
        with:
          files:
            build/app/outputs/flutter-apk/miapp-${{ github.ref_name }}.apk
        #  files: |
        #    build/app/outputs/flutter-apk/app-armeabi-v7a-release-$GITHUB_REF_NAME.apk
        #    build/app/outputs/flutter-apk/app-arm64-v8a-release-$GITHUB_REF_NAME.apk
        #    build/app/outputs/flutter-apk/app-x86_64-release-$GITHUB_REF_NAME.apk
